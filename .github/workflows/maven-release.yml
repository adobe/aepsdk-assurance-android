name: Publish Release (2.x)

on: 
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag (version) to be released (ex: 1.2.3).'
        type: string
        required: true

      create-github-release:
        description: 'Create GitHub release using tag. If the provided `tag` does not exist, it will be created.'
        type: boolean
        required: true
        default: true

      core-dependency:
        description: 'The Core dependency version in gradle.properties to be validated (ex: 1.2.3).'
        type: string
        required: true

      ref:
        description: |
          The git reference (branch, tag, or SHA) to check out when publishing the release.
          Defaults to 'main-v2.x'.
        required: false
        type: string
        default: 'main-v2.x'

jobs:
  publish:
    permissions:
        contents: write
    uses: adobe/aepsdk-commons/.github/workflows/android-maven-release.yml@gha-android-3.4.1
    with:
      tag: ${{ github.event.inputs.tag }}
      create-github-release: ${{ github.event.inputs.create-github-release == 'true' }}
      version-validation-paths: code/gradle.properties, code/assurance/src/main/java/com/adobe/marketing/mobile/Assurance.java
      version-validation-dependencies: Core ${{ github.event.inputs.core-dependency }}
      staging-dir: code/assurance/build/staging-deploy
      ref: ${{ github.event.inputs.ref }}
    secrets: inherit